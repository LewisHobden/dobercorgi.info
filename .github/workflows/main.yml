name: Deploy to GitHub Pages

# Deploys when a release is published, or on demand from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install Dependencies
      run: npm ci

    - name: Audit Dependencies
      run: npx --yes audit-ci@7.1.0 --config audit-ci.jsonc

    - name: Build Static Site
      run: npm run generate

    - uses: actions/upload-pages-artifact@v5
      with:
        path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
