# Development only - production is a static build deployed to GitHub Pages.
services:
  nuxt:
    container_name: dobercorgi-nuxtjs
    image: node:24-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
